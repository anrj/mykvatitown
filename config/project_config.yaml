# Convoying tunables — REAL HARDWARE (follower Duckiebot).
# Loaded by real_server.py. Tune these via the dashboard sliders on the bot.
# The live dashboard may rewrite this file when you drag sliders.

leader:
  grid_cols: 7
  grid_rows: 3
  dot_spacing_m: 0.0125
  blob_min_area: 4.0        # real camera may need finer blob detection
  target_span: 0.30         # tune: leader width in frame at desired follow distance
  stop_span: 0.50           # tune: leader this wide => too close, hold still
  span_deadband: 0.03

control:
  max_speed: 0.35           # conservative starting speed for real hardware
  chase_speed: 0.20
  steer_kp: 0.45
  steer_kd: 0.25
  dist_kp: 1.5
  accel_rate: 0.05
  decel_rate: 0.08
  search_turn: 0.10
  search_after_frames: 24
  loop_hz: 20

camera:                     # fill in after running camera calibration
  matrix: null
  dist_coeffs: null
