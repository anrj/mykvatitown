# Convoying tunables — REAL HARDWARE (follower Duckiebot).
# Loaded by real_server.py. Tune these via the dashboard sliders on the bot.
# The live dashboard may rewrite this file when you drag sliders.

leader:
  grid_cols: 7
  grid_rows: 3
  dot_spacing_m: 0.0125
  blob_min_area: 4.0        # real camera may need finer blob detection
  target_span: 0.12         # tune: leader width in frame at desired follow distance
  stop_span: 0.18           # tune: leader this wide => too close, hold still
  span_deadband: 0.03

control:
  max_speed: 0.35           # conservative starting speed for real hardware
  chase_speed: 0.20
  steer_kp: 0.45
  steer_kd: 0.10
  dist_kp: 1.5
  accel_rate: 0.05
  decel_rate: 0.08
  search_turn: 0.10
  search_after_frames: 24
  loop_hz: 20
  error_alpha: 0.30         # low-pass weight on new lateral_error/span (lower = smoother)
  d_deadband: 0.01          # ignore D-term deltas below this (kills jitter kicks)

detection:
  hold_frames: 3            # reuse last pose this many frames on a miss
  roi_pad: 30               # px padding around last bbox for ROI retry
  clahe: true               # CLAHE-gray retry on a miss

turn:
  excursion_thr: 0.35        # |lateral_error - baseline| to start a turn
  excursion_thr_strong: 0.55 # required while the follower is self-correcting
  tilt_thr: 0.10             # rad, row-tilt vs baseline to start a turn
  tilt_thr_strong: 0.18      # rad, required while self-correcting
  sustain_frames: 4          # consecutive same-sign frames to declare
  clear_thr: 0.12            # excursion below this to clear a turn
  clear_tilt: 0.04           # tilt below this to clear a turn
  baseline_alpha: 0.02       # EMA rate for lateral/tilt baselines
  self_stable_thr: 0.10      # |steer| EMA above this => follower unstable
  self_stable_alpha: 0.15    # EMA rate for |steer|
  sign_invert: false         # flip L/R label (confirm empirically once)

camera:                      # unused now (no solvePnP); kept for compatibility
  matrix: null
  dist_coeffs: null
