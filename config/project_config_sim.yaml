# Convoying tunables — SIMULATION (Godot).
# Loaded by virtual_server.py (sets agent.CONFIG_FILE to this file).
# The live dashboard may rewrite this file when you drag sliders.

leader:
  grid_cols: 7
  grid_rows: 3
  dot_spacing_m: 0.0125
  blob_min_area: 6.0
  target_span: 0.20
  stop_span: 0.30
  span_deadband: 0.03

control:
  max_speed: 0.45
  chase_speed: 0.30
  steer_kp: 0.55
  steer_kd: 0.30
  dist_kp: 2.0
  accel_rate: 0.05
  decel_rate: 0.08
  search_turn: 0.10
  search_after_frames: 24
  loop_hz: 20
  error_alpha: 0.30
  d_deadband: 0.01

detection:
  hold_frames: 3
  roi_pad: 30
  clahe: true

turn:
  excursion_thr: 0.35
  excursion_thr_strong: 0.55
  tilt_thr: 0.10
  tilt_thr_strong: 0.18
  sustain_frames: 4
  clear_thr: 0.12
  clear_tilt: 0.04
  baseline_alpha: 0.02
  self_stable_thr: 0.10
  self_stable_alpha: 0.15
  sign_invert: false

camera:
  matrix: null
  dist_coeffs: null

# Lane detection parameters for autonomous navigation
p_gain: 0.1
d_gain: 0.35
max_steer: 0.4
base_speed: 0.2
curve_speed: 0.2
curve_threshold: 350
steering_threshold: 0.2
curve_boost: 1.3
detection_threshold: 500

# Red stop line detection
red_stop:
  enabled: true
  lower_h1: 0
  upper_h1: 10
  lower_h2: 170
  upper_h2: 179
  lower_s: 80       # lower saturation = very lenient (catch red from very far away)
  upper_s: 255
  lower_v: 60
  upper_v: 255
  detection_threshold: 150  # pixels in center lane ROI needed to trigger stop
