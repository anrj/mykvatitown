# Convoying follower — SIMULATION.
# Lane servoing gains come from config/lane_servoing_config.yaml (shared).

leader:
  grid_cols: 7
  grid_rows: 3
  dot_spacing_m: 0.0125
  blob_min_area: 6.0
  target_span: 0.20
  stop_span: 0.30
  span_deadband: 0.03

control:
  max_speed: 0.45
  chase_speed: 0.30
  dist_kp: 2.0
  accel_rate: 0.05
  decel_rate: 0.08
  search_after_frames: 24
  loop_hz: 24
  error_alpha: 0.3

detection:
  hold_frames: 3
  roi_pad: 30
  clahe: true

turn:
  excursion_thr: 0.35
  excursion_thr_strong: 0.55
  tilt_thr: 0.10
  tilt_thr_strong: 0.18
  sustain_frames: 4
  clear_thr: 0.12
  clear_tilt: 0.04
  baseline_alpha: 0.02
  self_stable_thr: 0.10
  self_stable_alpha: 0.15
  sign_invert: false
  preturn_right_s: 0.83
  preturn_left_s: 0.33
  preturn_speed: 0.25
  turn_right_s: 1.5
  turn_left_s: 1.8
  turn_right_pwm: [0.30, 0.15]
  turn_left_pwm: [0.15, 0.30]
  exit_s: 0.125
  exit_speed: 0.35
  turn_cooldown_s: 3.0

lane_fallback:
  enabled: true
  lane_follow_timeout_s: 5.0

camera:
  matrix: null
  dist_coeffs: null
