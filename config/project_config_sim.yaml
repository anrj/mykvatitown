# Convoying tunables — SIMULATION (Godot).
# Loaded by virtual_server.py (sets agent.CONFIG_FILE to this file).
# The live dashboard may rewrite this file when you drag sliders.

leader:
  grid_cols: 7
  grid_rows: 3
  dot_spacing_m: 0.0125
  blob_min_area: 6.0
  target_span: 0.20
  stop_span: 0.30
  span_deadband: 0.03

control:
  max_speed: 0.45
  chase_speed: 0.30
  steer_kp: 0.55
  steer_kd: 0.30
  dist_kp: 2.0
  accel_rate: 0.05
  decel_rate: 0.08
  search_turn: 0.10
  search_after_frames: 24
  loop_hz: 20

signs:
  enabled: true
  min_tag_px: 38
  stop_hold_s: 2.0
  tag_meanings:
    0: stop
    1: slow

camera:
  matrix: null
  dist_coeffs: null
