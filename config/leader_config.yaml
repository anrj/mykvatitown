# Convoy leader — REAL HARDWARE (Duckiebot on the course).
# Deploy with: python launch.py --run --bot <hostname> --task project_leader
# Tune lane PID / HSV on the dashboard at http://<bot-ip>:5000

lane_stop:
  stop_trigger_line: left
  at_line_follow_line: right
  min_line_frames: 10
  line_lost_frames: 4
  bottom_line_px: 25
  stop_hold_s: 1.0
  line_speed_mult: 0.35

signs:
  red_strip_frac: 0.08
  red_pixel_frac: 0.035
  red_line_stop: 0.035
  red_hsv_low1: [0, 100, 100]
  red_hsv_high1: [10, 255, 255]
  red_hsv_low2: [160, 100, 100]
  red_hsv_high2: [179, 255, 255]
  lane_margin_px: 12
  red_line_close: 0.06
  red_close_strip_frac: 0.045
  red_confirm_frames: 4
  red_clear_frames: 20
  red_center_frac: 0.20
  red_min_band_rows: 0.35
  red_near_over_far: 1.15
  require_lane_for_red: false
  stop_tag_px: 55
  slow_tag_px: 38
  min_tag_px: 38
  tag_meanings:
    0: stop
    1: slow

intersection:
  enabled: true
  turns: [left, right, straight]
  stop_hold_s: 1.0
  turn_angle_deg: 90.0
  turn_timeout_s: 12.0
  tolerance_deg: 5.0
  converge_samples: 8

maneuver:
  cross_distance_m: 0.12
  cross_timeout_s: 8.0
  post_stop_speed: 0.20
  preturn_left_frames: 22
  preturn_right_frames: 22
  preturn_straight_frames: 20
  preturn_speed: 0.18

control:
  loop_hz: 20
  accel_rate: 0.05
  startup_grace_s: 2.0
